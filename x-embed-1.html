<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNBC-TV18 Live Feed</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #0f1419;
      --muted: #536471;
      --border: #e1e8ed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e11;
        --card: #15181c;
        --text: #e7e9ea;
        --muted: #8b98a5;
        --border: #2f3336;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px 16px;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      min-height: 400px;
    }
    .fallback {
      display: block;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CNBC-TV18 Live</h1>
      <p>Latest market updates from @CNBCTV18Live</p>
    </header>

    <div class="card">
      <a class="twitter-timeline"
         data-height="800"
         data-dnt="true"
         href="https://x.com/CNBCTV18Live?ref_src=twsrc%5Etfw">
        <span class="fallback">Loading posts by CNBCTV18Live…</span>
      </a>
    </div>
  </div>

  <script>
    // Match the embed to the visitor's light/dark setting
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.querySelector('.twitter-timeline').setAttribute('data-theme', 'dark');
    }
  </script>
  <script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
</body>
</html>
